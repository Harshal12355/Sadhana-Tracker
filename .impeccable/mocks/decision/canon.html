<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimal Linear-Style Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; background: #F9FAFB; color: #111827; font-family: 'Inter', sans-serif; display: flex; }
  .sidebar { width: 220px; background: #FFFFFF; border-right: 1px solid #E5E7EB; padding: 20px; }
  .main { flex: 1; padding: 32px 48px; display: flex; flex-direction: column; gap: 24px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; padding: 16px; }
  .table-card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; padding: 20px; flex: 1; }
</style>
</head>
<body>
  <aside class="sidebar"><strong>Sadhana Tracker</strong></aside>
  <main class="main">
    <h1 style="font-size:24px">Daily Overview</h1>
    <div class="kpis">
      <div class="kpi"><div>Japa Rounds</div><strong style="font-size:24px">12 / 16</strong></div>
      <div class="kpi"><div>Reading</div><strong style="font-size:24px">35m</strong></div>
      <div class="kpi"><div>Lectures</div><strong style="font-size:24px">42m</strong></div>
      <div class="kpi"><div>Streak</div><strong style="font-size:24px">13d</strong></div>
    </div>
    <div class="table-card">Standard Habit Log Table &amp; YouTube Links</div>
  </main>
</body>
</html>
