name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend:
    name: Frontend (Typecheck, Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend & test dependencies
        run: pip install -e "backend[dev]"

      - name: Run Pytest suite
        run: pytest backend/tests -v

      - name: Live FastAPI smoke check
        run: |
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/api/calendar?year=2026&month=11&city_id=nyc" | grep -q '"Rama Ekadashi'
          kill $SERVER_PID

  docker:
    name: Docker (Build & Container Smoke Check)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sadhana-valli:ci .

      - name: Run container and verify SPA + FastAPI endpoints
        run: |
          docker run -d --name sadhana-ci -p 8000:8000 sadhana-valli:ci
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/api/calendar?year=2026&month=11&city_id=nyc" | grep -q '"Rama Ekadashi'
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker stop sadhana-ci
