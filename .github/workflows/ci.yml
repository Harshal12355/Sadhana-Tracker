name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend:
    name: Frontend (Typecheck, Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend & test dependencies
        run: pip install -e "backend[dev]"

      - name: Run Pytest suite
        run: pytest backend/tests -v

      - name: Live FastAPI smoke check
        run: |
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/api/calendar?year=2026&month=11&city_id=nyc" | grep -q '"Rama Ekadashi'
          kill $SERVER_PID

  docker:
    name: Docker (Build & Container Smoke Check)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sadhana-valli:ci .

      - name: Run container and verify SPA + FastAPI endpoints
        run: |
          docker run -d --name sadhana-ci -p 8000:8000 sadhana-valli:ci
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/api/calendar?year=2026&month=11&city_id=nyc" | grep -q '"Rama Ekadashi'
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker stop sadhana-ci

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Only after a push to main whose checks passed. PRs and feature branches never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    env:
      # The Firebase web config is public (it ships inside the site's JavaScript), so it lives in
      # repository *variables*. Only the service account key below is a secret.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      HAS_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SADHANA_VALLI_2026 != '' }}
    steps:
      - name: Check deploy settings
        run: |
          missing=""
          [ "$HAS_DEPLOY_KEY" = "true" ] || missing="$missing secret:FIREBASE_SERVICE_ACCOUNT_SADHANA_VALLI_2026"
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID; do
            [ -n "${!v}" ] || missing="$missing variable:$v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not set up yet. Add in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Make sure the build has Firebase sign-in
        run: grep -rqF "$VITE_FIREBASE_PROJECT_ID" dist/assets

      - name: Deploy to the live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SADHANA_VALLI_2026 }}
          projectId: sadhana-valli-2026
          channelId: live
